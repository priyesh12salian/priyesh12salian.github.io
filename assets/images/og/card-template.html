<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff;font-family:Inter,Arial,sans-serif;color:#0f172a}
.card{position:relative;width:1200px;height:630px;padding:72px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;
 background-image:radial-gradient(circle,rgba(15,23,42,.12) 1.4px,transparent 1.8px);background-size:26px 26px}
.glow{position:absolute;right:-60px;top:-120px;width:720px;height:620px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#eaf1ff,rgba(234,241,255,.6) 45%,transparent 70%)}
.kick{position:relative;font:500 22px "JetBrains Mono",monospace;color:#0e7490;letter-spacing:.08em;text-transform:uppercase}
.title{position:relative;font-weight:800;font-size:__TS__px;line-height:1.08;letter-spacing:-.03em;margin-top:18px;max-width:1000px}
.sub{position:relative;font-weight:500;font-size:28px;line-height:1.4;color:#5b6577;margin-top:22px;max-width:920px}
.foot{position:relative;display:flex;align-items:center;justify-content:space-between}
.me{display:flex;align-items:center;gap:18px}
.logo{width:56px;height:56px;border-radius:14px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;letter-spacing:-.03em}
.me b{display:block;font-size:24px;font-weight:800}
.me span{display:block;font-size:18px;color:#5b6577;font-weight:500}
.url{font:500 20px "JetBrains Mono",monospace;color:#2563eb}
</style></head><body><div class="card"><div class="glow"></div>

</div></body></html>
